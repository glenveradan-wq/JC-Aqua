<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f4a52">
    {% include "_favicon.html" %}
    <title>Create account | JC Aqua Fish Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css', v=9) }}" rel="stylesheet">
</head>

<body class="site-page auth-background auth-register">
    <a class="auth-page-back" href="{{ url_for('home') }}" data-history-back aria-label="Go back" title="Go back">←</a>
    <main class="auth-wrap">
        <a class="site-brand auth-brand" href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='images/jc-aqua-logo.jpg') }}"
                alt="JC Aqua Fish Shop"
                width="40"
                height="40">
            <span>JC Aqua Fish Shop</span>
        </a>

        <section class="auth-card" aria-labelledby="register-title">
            <header class="auth-heading">
                <h1 id="register-title">Create your account</h1>
                <p>Create a staff account for the shop order system.</p>
            </header>

            {% include "_flashes.html" %}

            <form method="post" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-field">
                    <label for="full-name">Full name</label>
                    <input
                        id="full-name"
                        name="full_name"
                        type="text"
                        minlength="2"
                        maxlength="120"
                        autocomplete="name"
                        placeholder="Your full name"
                        required>
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="254"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="10"
                        maxlength="128"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required>
                </div>

                <div class="form-field">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        id="confirm-password"
                        name="confirm_password"
                        type="password"
                        minlength="10"
                        maxlength="128"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        required>
                </div>

                {% if requires_registration_code %}
                <div class="form-field">
                    <label for="registration-code">Staff registration code</label>
                    <input
                        id="registration-code"
                        name="registration_code"
                        type="password"
                        maxlength="128"
                        autocomplete="off"
                        placeholder="Enter the shop registration code"
                        required>
                </div>
                {% endif %}

                <button class="button button-full" type="submit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}" defer></script>
</body>
</html>
