<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f4a52">
    {% include "_favicon.html" %}
    <title>{{ title }} | JC Aqua Fish Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css', v=9) }}" rel="stylesheet">
</head>

<body class="site-page">
    <a class="auth-page-back" href="{{ url_for('home') }}" data-history-back aria-label="Go back" title="Go back">←</a>
    <main class="auth-wrap">
        <a class="site-brand auth-brand" href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='images/jc-aqua-logo.jpg') }}"
                alt="JC Aqua Fish Shop"
                width="40"
                height="40">
            <span>JC Aqua Fish Shop</span>
        </a>
        <section class="auth-card">
            <header class="auth-heading">
                <h1>{{ title }}</h1>
                <p>{{ message }}</p>
            </header>
            <a class="button button-secondary" href="/">Return home</a>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
</body>
</html>
