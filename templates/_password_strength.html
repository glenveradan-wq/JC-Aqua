<div class="password-strength" data-password-strength hidden>
    <div class="password-strength-track" aria-hidden="true">
        <span class="password-strength-fill" data-password-strength-fill></span>
    </div>
    <p class="password-strength-label">
        Strength: <strong data-password-strength-label></strong>
    </p>
    <ul class="password-strength-rules" aria-label="Password requirements">
        <li data-password-rule="length">At least 8 characters</li>
        <li data-password-rule="upper">One uppercase letter</li>
        <li data-password-rule="lower">One lowercase letter</li>
        <li data-password-rule="number">One number</li>
        <li data-password-rule="special">One special character (for Hard)</li>
    </ul>
</div>
