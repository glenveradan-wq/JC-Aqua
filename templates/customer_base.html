<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f4a52">
    {% include "_favicon.html" %}
    <title>{% block title %}Customer account{% endblock %} | JC Aqua Fish Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css', v=9) }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="site-page {% block body_class %}{% endblock %}">
    <header class="site-header">
        <nav class="site-nav" aria-label="Customer navigation">
            <div class="site-nav-brand">
                <a class="page-back" href="{{ url_for('customer_dashboard') }}" data-history-back aria-label="Go back" title="Go back">←</a>
                <a class="site-brand" href="{{ url_for('home') }}">
                    <img
                        src="{{ url_for('static', filename='images/jc-aqua-logo.jpg') }}"
                        alt="JC Aqua Fish Shop"
                        width="40"
                        height="40">
                    <span>JC Aqua Fish Shop</span>
                </a>
            </div>
            <div class="nav-actions">
                <a class="nav-link" href="{{ url_for('customer_dashboard') }}" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Shop</a>
                <a class="nav-link" href="{{ url_for('customer_cart_view') }}" {% if active_page == "cart" %}aria-current="page"{% endif %}>Cart</a>
                <a class="nav-link" href="{{ url_for('customer_orders') }}" {% if active_page == "orders" %}aria-current="page"{% endif %}>My orders</a>
                <a class="nav-link" href="{{ url_for('customer_profile') }}" {% if active_page == "profile" %}aria-current="page"{% endif %}>Profile</a>
                <form method="post" action="{{ url_for('customer_logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="nav-link nav-logout" type="submit">Sign out</button>
                </form>
            </div>
        </nav>
    </header>
    <main class="workspace-main customer-main">
        {% include "_flashes.html" %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><p>JC Aqua Fish Shop</p></footer>
    <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
